name: build-container

# Build and (on non-PR events) publish the dumpling container image to GHCR. The same OCI image is consumed by both Docker
# (`docker pull ghcr.io/odcambc/dumpling:<tag>`) and Apptainer
# (`apptainer pull docker://ghcr.io/odcambc/dumpling:<tag>` — apptainer
# converts to SIF on pull). See tasks.md "container branch" for design notes.

on:
  push:
    branches: [container, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [dev, main]
    paths:
      - Dockerfile
      - dumpling_env.yaml
      - 'workflow/**'
      - 'config/**'
      - .github/workflows/build-container.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy:
      #   container branch  -> :container, :dev   (dev tag matches the
      #                        `containerized:` directive in workflow/Snakefile)
      #   dev branch        -> :dev               (will overtake container's
      #                        :dev once the container branch merges)
      #   tag vX.Y.Z        -> :vX.Y.Z, :vX.Y, :latest
      #   PR                -> no tag emitted; image built but not pushed
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/odcambc/dumpling
          tags: |
            type=raw,value=container,enable=${{ github.ref == 'refs/heads/container' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/container' || github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Build the image to verify it compiles (catches Dockerfile/env
      # breakage). On PRs this is the only build (nothing is pushed below).
      #
      # NOTE: an in-image `snakemake --dry-run` smoke test used to run here,
      # but it validated the DAG against config/example.yaml whose `data_dir:
      # example/data` is gitignored — a fresh CI checkout has no input data, so
      # validate_config hard-fails. Re-enabling it needs a committed,
      # self-contained CI fixture (config + placeholder FASTQs matching
      # config/example.csv + reference). Tracked as a follow-up.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Re-build for push using the buildx cache from the build step; this
      # is fast (cache hit on every layer) and emits the metadata-action
      # tags.
      - name: Push to GHCR
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
