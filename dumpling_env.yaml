name: dumpling_env
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.13
  - snakemake>=8.0
  - snakemake-wrapper-utils
  - pandas
  - biopython
  - fastqc
  - samtools
  # Pinned: bbmap 39.76+ regressed `bbmerge ecco` (crashes at
  # WriterFactory.makeWriter, java.lang.AssertionError) on all arches.
  # 39.52 is the highest version bioconda ships that still works. The
  # test-env.yml CI guard rebuilds this on every PR; its `latest` cell
  # flips green once upstream fixes it, signalling we can unpin.
  - bbmap=39.52
  - minimap2
  - gatk4>=4.5.0.0
  - regex
  - pip
  - pip:
      - multiqc>=1.25
      - regex
      # MAVE-HGVS validator used by workflow/rules/scripts/format_mavedb.py
      # to catch malformed variants before MaveDB deposit. Not on conda
      # (verified 2026-05-26).
      - mavehgvs
